server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Nginx 1.30.6 is pinned in Dockerfile.prod. Location cache/privacy headers
    # must not suppress this policy, including on 404/405 responses.
    add_header_inherit merge;
    # Start in report-only until separately authorised live staging validation.
    # No collector: browser reports can contain recovery URLs and financial data.
    # WebKit 27.2 native <select> uses exactly "text-overflow:inherit" internally.
    # In enforcement, only that inert attribute hash permits an inline style.
    # https://github.com/microsoft/playwright/issues/43416
    add_header Content-Security-Policy-Report-Only "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-hashes' 'sha256-3oFxofzq3N//6J8H86e9ul4WT2OkJrtonB66gn/TLJw='; img-src 'self'; font-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; media-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # TanStack Router deep links, including GET /login, need the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
