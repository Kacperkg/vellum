# Dispatch only; keep this reviewed path on default staging and main.
name: Promote production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deployment:
        description: I approve production replacement, API downtime, migrations and smoke requests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vellum-deploy-production
  cancel-in-progress: false

env:
  CONFIRM_PRODUCTION_DEPLOYMENT: ${{ inputs.confirm_production_deployment }}
  VELLUM_CD_ENABLED: ${{ vars.VELLUM_CD_ENABLED }}
  PRODUCTION_APPROVAL_MODE: ${{ vars.PRODUCTION_APPROVAL_MODE }}

jobs:
  discover:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Kacperkg/vellum' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      vars.VELLUM_CD_ENABLED == 'true' && vars.PRODUCTION_APPROVAL_MODE == 'manual' &&
      inputs.confirm_production_deployment == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find the unique tested staging release (read only)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/production_release.py discover

  promote:
    needs: discover
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Kacperkg/vellum' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      vars.VELLUM_CD_ENABLED == 'true' && vars.PRODUCTION_APPROVAL_MODE == 'manual' &&
      inputs.confirm_production_deployment == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PRODUCTION_READINESS_MODE: ${{ vars.PRODUCTION_READINESS_MODE }}
      EXPECTED_RELEASE: ${{ needs.discover.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the exact staging release before AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/production_release.py prepare --output approved-release.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: vars.PRODUCTION_READINESS_MODE != 'automated'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
          role-session-name: vellum-production-${{ github.run_id }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: vars.PRODUCTION_READINESS_MODE == 'automated'
        with:
          role-to-assume: ${{ vars.AWS_READINESS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
          role-session-name: vellum-production-${{ github.run_id }}
      - name: Promote exact digests through production-specific SSM document
        env:
          GH_TOKEN: ${{ github.token }}
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          SSM_DOCUMENT_ARN: ${{ vars.SSM_DOCUMENT_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          VELLUM_DISPATCH_FUNCTION: ${{ vars.VELLUM_DISPATCH_FUNCTION }}
          VELLUM_DISPATCH_AUDIENCE: ${{ vars.VELLUM_DISPATCH_AUDIENCE }}
          SSM_DOCUMENT_VERSION: '2'
          SSM_DOCUMENT_SHA256: 8d43e90f07c95456d7f781b591cc187eaf448e0c80b3a87d0433b9665297f83a
        run: python3 scripts/ci/production_release.py dispatch --manifest approved-release.json
