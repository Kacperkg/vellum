# Staging only; remains inert until the operator sets VELLUM_CD_ENABLED=true.
name: Release staging
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual staging deployment verification · {0}', github.sha) || github.event.head_commit.message }}

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character staging commit SHA to build and deploy
        required: true
        type: string
      confirm_staging_deployment:
        description: I approve staging container replacement, AutoMigrate/seeding and smoke requests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vellum-deploy-staging
  cancel-in-progress: false

jobs:
  verification-request:
    name: Validate manual staging deployment request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed before CI or release credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM_STAGING_DEPLOYMENT: ${{ inputs.confirm_staging_deployment }}
          VELLUM_CD_ENABLED: ${{ vars.VELLUM_CD_ENABLED }}
        run: python3 scripts/ci/staging_verification.py guard

  checks:
    needs: verification-request
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && needs.verification-request.result == 'success')) &&
      github.repository == 'Kacperkg/vellum' &&
      github.ref == 'refs/heads/staging' && github.ref_protected
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-and-deploy:
    needs: [checks, verification-request]
    if: >-
      always() && !cancelled() &&
      needs.checks.result == 'success' && needs.checks.outputs.deploy == 'true' &&
      vars.VELLUM_CD_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && needs.verification-request.result == 'success')) &&
      github.repository == 'Kacperkg/vellum' &&
      github.ref == 'refs/heads/staging' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRM_STAGING_DEPLOYMENT: ${{ inputs.confirm_staging_deployment }}
      VELLUM_CD_ENABLED: ${{ vars.VELLUM_CD_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate manual request before publication
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/ci/staging_verification.py guard
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Registry identity and immutable version
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          printf 'prefix=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'version=sha-%s-run-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: GHCR login (job-scoped token)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: backend
          file: backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.prefix }}-backend:${{ steps.identity.outputs.version }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=release-backend
            type=gha,scope=production-backend
          cache-to: type=gha,mode=max,scope=release-backend
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.prefix }}-frontend:${{ steps.identity.outputs.version }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=release-frontend
            type=gha,scope=production-frontend
          cache-to: type=gha,mode=max,scope=release-frontend
      - name: Write candidate manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/ci/staging_verification.py candidate --backend "$BACKEND_DIGEST" --frontend "$FRONTEND_DIGEST" --output candidate.json
          else
            python3 deploy/cd/release.py candidate --backend "$BACKEND_DIGEST" --frontend "$FRONTEND_DIGEST" --output candidate.json
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
          role-session-name: vellum-staging-${{ github.run_id }}
      - name: Deploy through fixed SSM document and verify Caddy
        id: deployment
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          SSM_DOCUMENT_ARN: ${{ vars.SSM_DOCUMENT_ARN }}
          SSM_DOCUMENT_VERSION: ${{ vars.SSM_DOCUMENT_VERSION }}
          SSM_DOCUMENT_SHA256: ${{ vars.SSM_DOCUMENT_SHA256 }}
        run: python3 deploy/cd/release.py dispatch --environment staging --manifest candidate.json
      - name: Record successful staging verification
        env:
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}
        run: |
          mkdir -p tested-release
          python3 deploy/cd/release.py mark-verified --manifest candidate.json --command-id "$COMMAND_ID" --output tested-release/release.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain immutable tested release manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # Manual evidence is intentionally not a production promotion artifact.
          name: ${{ github.event_name == 'workflow_dispatch' && 'vellum-staging-verification' || 'vellum-release' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tested-release/release.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Logout of GHCR
        if: always()
        run: docker logout ghcr.io
